version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # uv updates pyproject.toml and uv.lock together, so CI (uv sync --locked)
  # tests exactly what a pull request proposes.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      development-dependencies:
        patterns: ["*"]
    # pytest-homeassistant-custom-component pins these exactly (==), so an
    # update to any of them on its own cannot resolve and fails the whole
    # group. They move when the harness pin is bumped. The contract tests
    # check this list against the installed harness.
    ignore:
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
      - dependency-name: syrupy
