version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # uv updates pyproject.toml and uv.lock together, so CI (uv sync --locked)
  # tests exactly what a pull request proposes.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      development-dependencies:
        patterns: ["*"]
