version: 2
# Labels are explicit, and the same as in lafro/ha-watercare: github-actions
# in kebab case instead of Dependabot's default github_actions. Dependabot
# ignores a listed label that does not exist in the repository (it only
# creates its default labels), so create a label before listing it here.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ["*"]
  # uv updates pyproject.toml and uv.lock together, so CI (uv sync --locked)
  # tests exactly what a pull request proposes.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, python]
    groups:
      development-dependencies:
        patterns: ["*"]
    # pytest-homeassistant-custom-component pins these exactly (==), so an
    # update to one of them on its own cannot resolve: Dependabot skips it and
    # records an error that fails the uv job, as pytest 9.1.1 did against the
    # harness's pytest==9.0.3. They move when the harness pin is bumped.
    # ignore also applies to security updates: Dependabot opens no security
    # pull request for these four, but their alerts still show. Fix such an
    # alert by bumping the harness pin. The contract tests check that this
    # list is exactly the dev dependencies the installed harness pins with ==.
    ignore:
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
      - dependency-name: syrupy
